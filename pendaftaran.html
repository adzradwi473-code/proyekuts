<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Workshop - BorneoDance Culture</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <header>
        <div class="container navbar">
            <h1 class="logo">BorneoDance</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Beranda</a></li>
                    <li><a href="katalog.html">Katalog Tari</a></li>
                    <li><a href="pendaftaran.html" class="active">Pendaftaran</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="container form-section">
            <div class="section-title">
                <h3>Pendaftaran Workshop Tari Tradisional</h3>
                <p>Daftarkan diri Anda untuk mengikuti program pelatihan seni gerak tari tradisional Borneo langsung bersama instruktur dan maestro budaya bersertifikasi.</p>
            </div>
            <form id="workshopForm" class="workshop-form">
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" placeholder="Masukkan nama lengkap Anda" required>
                </div>
                <div class="form-group">
                    <label for="email">Alamat Email Aktif</label>
                    <input type="email" id="email" placeholder="nama@email.com" required>
                </div>
                <div class="form-group">
                    <label for="pilihanTari">Pilihan Program Workshop Tari</label>
                    <select id="pilihanTari">
                        <option value="Tari Radap Rahayu">Tari Radap Rahayu (Kalimantan Selatan)</option>
                        <option value="Tari Gantar">Tari Gantar (Kalimantan Timur)</option>
                        <option value="Tari Hudoq">Tari Hudoq (Kalimantan Timur)</option>
                        <option value="Tari Balean Dadas">Tari Balean Dadas (Kalimantan Tengah)</option>
                        <option value="Tari Monong">Tari Monong (Kalimantan Barat)</option>
                        <option value="Tari Jepen">Tari Jepen (Kalimantan Utara)</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Kirim Pendaftaran</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="container footer-content">
            <p>&copy; BorneoDance Culture</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
